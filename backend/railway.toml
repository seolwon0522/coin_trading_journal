[build]
builder = "nixpacks"
buildCommand = "./gradlew build"
watchPatterns = [
  "backend/**/*.java",
  "backend/**/*.yml",
  "backend/**/*.yaml",
  "backend/**/*.properties",
  "backend/build.gradle",
  "backend/settings.gradle"
]

[deploy]
startCommand = "java -Dspring.profiles.active=railway -jar build/libs/*.jar"
healthcheckPath = "/health"
healthcheckTimeout = 100
restartPolicyType = "on-failure"
restartPolicyMaxRetries = 3
region = "us-west1"
numReplicas = 1

[environments.production]
PORT = "8080"
SPRING_PROFILES_ACTIVE = "railway"
JAVA_TOOL_OPTIONS = "-XX:MaxRAMPercentage=75.0 -XX:+UseG1GC"

[environments.production.domains]
"api.cryptotrademanager.com" = { ssl = true }

[services.database]
plan = "hobby"
plugin = "postgresql"

[services.redis]
plan = "hobby"
plugin = "redis"