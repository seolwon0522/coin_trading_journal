spring:
  application:
    name: trading-bot

  # Web 설정 - API 경로가 정적 리소스로 처리되지 않도록 설정
  mvc:
    throw-exception-if-no-handler-found: true  # 핸들러 없을 때 예외 발생
    static-path-pattern: /static/**  # 정적 리소스는 /static/** 경로에서만 제공

  datasource:
    url: jdbc:postgresql://localhost:5432/trading_bot
    username: postgres
    password: 1q2w3e4r!
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    open-in-view: false  # N+1 문제 방지 및 성능 개선
    properties:
      hibernate:
        format_sql: true
        jdbc:
          batch_size: 20  # 배치 삽입 최적화
        order_inserts: true
        order_updates: true
        generate_statistics: false


# JWT 설정
jwt:
  secret: ${JWT_SECRET:ThisIsAVerySecureJWTSecretKeyForDevelopmentUse1234567890AbcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ} # 개발용 고정 JWT 키 (108자)
  access-token-validity-in-seconds: 1800
  refresh-token-validity-in-seconds: 604800

# OAuth2 설정
oauth2:
  google:
    client-id: 25307816741-f2030iqmhammf9r9l65gt6hv61vjf58p.apps.googleusercontent.com
  apple:
    client-id: development-apple-client-id

# 암호화 설정
crypto:
  secret:
    key: ${CRYPTO_SECRET_KEY:3saXgsXn/tNN4CwUzOHLfy23f39UIT/W6uXD5N2HxeY=} # 개발용 고정 AES-256 키 (32바이트)

# Binance API 설정
binance:
  api:
    base-url: https://api.binance.com
    testnet-url: https://testnet.binance.vision
    use-testnet: false
    websocket-url: wss://stream.binance.com:9443
    testnet-websocket-url: wss://testnet.binance.vision

# Nautilus Service 설정
nautilus:
  service:
    url: http://localhost:8001

# Redis 설정
  redis:
    host: ${REDIS_HOST:localhost}
    port: ${REDIS_PORT:6379}
    password: ${REDIS_PASSWORD:}
    timeout: 2000ms
    lettuce:
      pool:
        max-active: 8
        max-idle: 8
        min-idle: 2
        max-wait: -1ms

# Resilience4j Circuit Breaker 설정
resilience4j:
  circuitbreaker:
    instances:
      nautilusService:
        register-health-indicator: true
        sliding-window-size: 10
        minimum-number-of-calls: 5
        permitted-number-of-calls-in-half-open-state: 3
        automatic-transition-from-open-to-half-open-enabled: true
        wait-duration-in-open-state: 30s
        failure-rate-threshold: 50
        slow-call-rate-threshold: 100
        slow-call-duration-threshold: 5s
        record-exceptions:
          - com.example.trading_bot.nautilus.NautilusClientException
          - org.springframework.web.reactive.function.client.WebClientRequestException
        ignore-exceptions:
          - org.springframework.web.reactive.function.client.WebClientResponseException.BadRequest

  retry:
    instances:
      nautilusService:
        max-attempts: 3
        wait-duration: 1s
        enable-exponential-backoff: true
        exponential-backoff-multiplier: 2
        retry-exceptions:
          - org.springframework.web.reactive.function.client.WebClientRequestException
        ignore-exceptions:
          - org.springframework.web.reactive.function.client.WebClientResponseException.BadRequest
          - org.springframework.web.reactive.function.client.WebClientResponseException.NotFound

  timelimiter:
    instances:
      nautilusService:
        timeout-duration: 10s

# CORS 설정 (로컬 개발용)
cors:
  allowed-origins: http://localhost:3000,http://localhost:3001,http://127.0.0.1:3000
  allowed-methods: GET,POST,PUT,DELETE,OPTIONS,PATCH
  allowed-headers: "*"
  allow-credentials: true

---
# 개발 환경 설정
spring:
  config:
    activate:
      on-profile: dev

  datasource:
    url: jdbc:postgresql://localhost:5432/trading_bot_dev

  jpa:
    show-sql: true
    properties:
      hibernate:
        format_sql: true

logging:
  level:
    com.example.trading_bot: DEBUG

---
# 운영 환경 설정
spring:
  config:
    activate:
      on-profile: prod

  datasource:
    url: jdbc:postgresql://prod-server:5432/trading_bot_prod

  jpa:
    show-sql: false
    properties:
      hibernate:
        format_sql: false

logging:
  level:
    com.example.trading_bot: INFO

---
# 로컬(H2) 환경 설정
spring:
  config:
    activate:
      on-profile: local

  datasource:
    url: jdbc:h2:mem:trading_local;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  h2:
    console:
      enabled: true
      path: /h2-console
