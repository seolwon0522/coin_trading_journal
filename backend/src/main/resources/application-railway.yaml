server:
  port: ${PORT:8080}

spring:
  # PostgreSQL configuration using Spring Boot standard properties
  datasource:
    url: jdbc:postgresql://${PGHOST:localhost}:${PGPORT:5432}/${PGDATABASE:railway}
    username: ${PGUSER:postgres}
    password: ${PGPASSWORD:password}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

# JWT Configuration
jwt:
  secret: ${JWT_SECRET}

# Crypto Configuration  
crypto:
  secret:
    key: ${CRYPTO_SECRET_KEY}

# CORS Configuration
cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS}

# Logging
logging:
  level:
    root: INFO