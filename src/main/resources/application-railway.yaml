server:
  port: ${PORT:8080}

spring:
  config:
    activate:
      on-profile: railway

  # Database configuration for Railway PostgreSQL Service
  datasource:
    # Use individual PG* variables for better control and debugging
    url: jdbc:postgresql://${PGHOST:localhost}:${PGPORT:5432}/${PGDATABASE:railway}?sslmode=prefer
    username: ${PGUSER:postgres}
    password: ${PGPASSWORD:password}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 5
      minimum-idle: 1
      connection-timeout: 10000
      initialization-fail-timeout: -1

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: false
        dialect: org.hibernate.dialect.PostgreSQLDialect
        jdbc:
          lob:
            non_contextual_creation: true
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    open-in-view: false

  # Security
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID:617965160441-duhprvkkvvhgifgp12osligng8scp8bd.apps.googleusercontent.com}
            client-secret: ${GOOGLE_CLIENT_SECRET:}
            scope:
              - email
              - profile

# JWT Configuration
jwt:
  secret: ${JWT_SECRET:ThisIsAVerySecureJWTSecretKeyForProductionUse1234567890AbcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ}
  access-token-validity-in-seconds: 1800
  refresh-token-validity-in-seconds: 604800

# Crypto Configuration
crypto:
  secret:
    key: ${CRYPTO_SECRET_KEY:3saXgsXn/tNN4CwUzOHLfy23f39UIT/W6uXD5N2HxeY=}

# Binance API Configuration
binance:
  api:
    base-url: https://api.binance.com
    testnet-url: https://testnet.binance.vision
    use-testnet: ${USE_BINANCE_TESTNET:true}
    websocket-url: wss://stream.binance.com:9443
    testnet-websocket-url: wss://testnet.binance.vision
    api-key: ${BINANCE_API_KEY:}
    secret-key: ${BINANCE_SECRET_KEY:}

# CORS Configuration
cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:https://frontend-eewqhvu38-seolwon0522s-projects.vercel.app,http://localhost:3000}
  allowed-methods: GET,POST,PUT,DELETE,OPTIONS
  allowed-headers: "*"
  allow-credentials: true

# Actuator
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
      base-path: /actuator
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true

# Logging
logging:
  level:
    root: INFO
    com.example.trading_bot: DEBUG
    org.springframework.web: INFO
    org.springframework.boot: INFO
    org.springframework.boot.autoconfigure: INFO
    org.springframework.boot.diagnostics: DEBUG
    org.springframework.jdbc: DEBUG
    org.hibernate: INFO
    com.zaxxer.hikari: DEBUG