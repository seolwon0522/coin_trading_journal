server:
  port: ${PORT:8080}

spring:
  config:
    activate:
      on-profile: railway

  # DatabaseConfig.java가 DATABASE_URL을 자동 변환
  datasource:
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 5
      minimum-idle: 1

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

# JWT Configuration
jwt:
  secret: ${JWT_SECRET:defaultJwtSecretKey}
  access-token-validity-in-seconds: 1800
  refresh-token-validity-in-seconds: 604800

# Crypto Configuration
crypto:
  secret:
    key: ${CRYPTO_SECRET_KEY:defaultCryptoKey}

# Binance API Configuration
binance:
  api:
    base-url: https://api.binance.com
    testnet-url: https://testnet.binance.vision
    use-testnet: ${USE_BINANCE_TESTNET:true}
    websocket-url: wss://stream.binance.com:9443
    testnet-websocket-url: wss://testnet.binance.vision
    api-key: ${BINANCE_API_KEY:}
    secret-key: ${BINANCE_SECRET_KEY:}

# CORS Configuration
cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
  allowed-methods: GET,POST,PUT,DELETE,OPTIONS
  allowed-headers: "*"
  allow-credentials: true

# Logging
logging:
  level:
    root: INFO
    com.example.trading_bot: INFO