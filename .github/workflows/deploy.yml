name: Deploy Production

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  test-backend:
    uses: ./.github/workflows/backend-ci.yml
    
  test-frontend:
    uses: ./.github/workflows/frontend-ci.yml
    
  deploy-notification:
    needs: [test-backend, test-frontend]
    runs-on: ubuntu-latest
    steps:
      - name: Deployment Triggered
        run: |
          echo "✅ All tests passed!"
          echo "🚀 Deployment to Railway and Vercel will be triggered automatically"
          echo "Railway: Watching for changes in /backend directory"
          echo "Vercel: Watching for changes in /frontend directory"
          
      - name: Create deployment record
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.createDeployment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: context.ref,
              task: 'deploy',
              auto_merge: false,
              required_contexts: [],
              environment: 'production',
              description: 'Deploying to Railway and Vercel'
            });